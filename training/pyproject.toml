[project]
name = "doomscroll-training"
version = "0.1.0"
description = "Teacher data, fine-tuning, evaluation and ONNX export for Doomscroll Autopsy (PDD section 10)."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
]
export = [
    "onnx>=1.23.2",
    "onnxconverter-common>=1.16.0",
    "onnxruntime-genai==0.18.0",
    "onnxscript>=0.7.2",
    "optimum-onnx[onnxruntime]>=0.1.0",
    "peft>=0.21.2",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=4.57.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
